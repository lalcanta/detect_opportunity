name: CI / CD - Test & Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Tests & Quality Assurance
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install lead-engine-cli dependencies
        run: npm --prefix lead-engine-cli ci

      - name: 📦 Install lead-dashboard-web dependencies
        run: npm --prefix lead-dashboard-web ci

      - name: 🔍 Typecheck (TypeScript)
        run: |
          npm --prefix lead-engine-cli run typecheck
          npm --prefix lead-dashboard-web run typecheck

      - name: 🛡️ Run Test Suite (Business Rules, Components & Templates)
        run: npm test

  deploy-dashboard:
    name: 🚀 Deploy Cloudflare Pages (lead-dashboard)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dashboard dependencies
        run: npm --prefix lead-dashboard-web ci

      - name: 🚀 Deploy to Cloudflare Pages
        run: |
          # Sécurisation : supprime automatiquement 'Bearer ' ou les guillemets si collés par erreur dans le secret GitHub
          CLEAN_TOKEN=$(echo -n "${CLOUDFLARE_API_TOKEN}" | sed -E 's/^[bB][eE][aA][rR][eE][rR][[:space:]]+//' | tr -d '"'\'' ' | tr -d '\r\n')
          export CLOUDFLARE_API_TOKEN="${CLEAN_TOKEN}"
          npx wrangler pages deploy public --project-name=lead-dashboard --branch=main --commit-dirty=true
        working-directory: lead-dashboard-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
