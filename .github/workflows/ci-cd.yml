name: CI - Tests & Quality Assurance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Tests & Quality Assurance
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install lead-engine-cli dependencies
        run: npm --prefix lead-engine-cli ci

      - name: 📦 Install lead-dashboard-web dependencies
        run: npm --prefix lead-dashboard-web ci

      - name: 🔍 Typecheck (TypeScript)
        run: |
          npm --prefix lead-engine-cli run typecheck
          npm --prefix lead-dashboard-web run typecheck

      - name: 🛡️ Run Full Test Suite
        run: npm test

      # Démarre son propre serveur local (wrangler pages dev, port 8789, base D1 neuve dans /tmp/lead-d1-test-state).
      # Aucun secret requis : le jeton de sync est injecté par tests/setupTestEnv.ts, et le lien dev-local/.dev.vars
      # (absent en CI) est ignoré par wrangler.
      - name: 🌐 Tests fonctionnels (serveur local, base neuve)
        timeout-minutes: 5
        run: npm run test:functional
